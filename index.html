<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Seatwork 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body{
            background-image: url(bg.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .title{
            background-color: aliceblue;
            width: 500px;
            height: 100px;
            border-radius: 20px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 5px;
            border: dashed #8b0000;
        }

        h1{
            color: #8b0000;
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        .subtitle{
            color: #555;
            letter-spacing: 2px;
            margin: 0;
        }

        .names{
            background-color: white;
            padding: 30px;
            border: 2px solid #8b0000;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 12px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover{
            background-color: #600000;
        }

        #message{
            width: 500px;
            max-width: 90%;
            margin: 20px auto;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .footer_div{
            background-color: rgb(85, 6, 6);
            text-align: center;
            margin-top: auto;
            padding: 15px;
            color: white;
            width: 100%;
        }
    </style>
    
</head>
<body class="mt-0">
    <div class="title">
        <h1>MATH CLUB CHECKER</h1>
        <p class="subtitle">CANDIDATE VERIFICATION SYSTEM</p>
    </div>

    <div class="names">
        <input type="text" id="first_name" placeholder="First Name">
        <input type="text" id="last_name" placeholder="Last Name">
            
        <button py-click="check_name">ENTER</button>
    </div>

        <p id="message"></p>

    <div class="footer_div">
        <footer>
            2026 MATHEMATICS Club | Seatwork 1 | 2nd Quarter
        </footer>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
